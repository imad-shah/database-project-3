[project]
name = "real-estate-office"
version = "0.1.0"
description = "PostgreSQL-backed management app for a real-estate office"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
